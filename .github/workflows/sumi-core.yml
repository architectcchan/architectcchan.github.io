name: SumiCore

on:
  push:
    paths:
      - "sumi/SumiCore/**"
      - ".github/workflows/sumi-core.yml"
  pull_request:
    paths:
      - "sumi/SumiCore/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sumi/SumiCore
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build and test
        run: swift test --parallel
